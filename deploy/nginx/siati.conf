# ==============================================================================
# KONFIGURASI NGINX PRODUCTION UNTUK SIATI (Sistem Informasi Aduan TI Rumah Sakit)
# Lokasi file di server Linux: /etc/nginx/sites-available/siati.conf
# ==============================================================================

# 1. Rate Limiting Zones (Pertahanan Anti-DDoS & Brute Force)
# - general_limit: 30 request/detik untuk aset & halaman umum
# - login_limit: 5 request/menit untuk mencegah brute force NIP/Password
# - upload_limit: 5 request/menit untuk mencegah flooding upload video/foto
limit_req_zone $binary_remote_addr zone=siati_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=siati_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=siati_upload:10m rate=5r/m;

# 2. Redirect HTTP ke HTTPS Otomatis
server {
    listen 80;
    listen [::]:80;
    server_name siati.rumahsakit.co.id;

    # Izinkan verifikasi Certbot ACME Challenge untuk Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Server Utama HTTPS (Port 443 SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siati.rumahsakit.co.id;

    # Sertifikat SSL TLS (Gunakan Let's Encrypt atau Sertifikat Resmi RS)
    ssl_certificate /etc/letsencrypt/live/siati.rumahsakit.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siati.rumahsakit.co.id/privkey.pem;

    # SSL Security Hardening (Sesuai Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers Wajib (Anti-Clickjacking, Anti-MIME Sniffing, CSP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' wss: https://challenges.cloudflare.com;" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Sembunyikan Versi Nginx agar tidak dianalisis scanner peretas
    server_tokens off;

    # Batasi Ukuran Body Request (Max 60MB untuk upload video 60 detik)
    client_max_body_size 60M;
    client_body_buffer_size 256k;

    # Blokir Akses ke File Rahasia / Tersembunyi (.git, .env, .config)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir Akses Langsung ke file berpotensi berbahaya
    location ~* \.(sql|bak|old|php|phtml|sh|py|pl|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Route Khusus Login (Proteksi Brute Force Ketat)
    location /api/auth/login {
        limit_req zone=siati_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route Khusus Upload Berkas Media (Rate Limit Khusus & Timeout Longgar)
    location /api/upload {
        limit_req zone=siati_upload burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Route Server-Sent Events (SSE) Siaran Real-Time SIATI
    # Matikan proxy buffering dan cache agar pesan update langsung tiba di browser tanpa delay
    location /api/realtime {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # STORAGE MEDIA TERLINDUNGI (HANYA BISA DIAKSES MELALUI X-Accel-Redirect)
    # Hacker yang mencoba menembak langsung URL ini akan mendapatkan 404/403 Not Found
    location /protected_media/ {
        internal;
        alias /var/siati/media/;
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff";
        # Matikan eksekusi skrip apapun di folder media
        types { }
        default_type application/octet-stream;
    }

    # Proxy Utama ke Aplikasi Next.js App Router (Port 3000)
    location / {
        limit_req zone=siati_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
