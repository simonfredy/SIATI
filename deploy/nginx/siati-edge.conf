# ==============================================================================
# KONFIGURASI NGINX EDGE ACCELERATOR (Skenario 4: Nginx Front-End -> Apache Core)
# Lokasi: /etc/nginx/sites-available/siati-edge.conf
# Port: 80 & 443 (Publik) -> Meneruskan ke Apache 127.0.0.1:8080
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name siati.rumahsakit.co.id;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siati.rumahsakit.co.id;

    # SSL TLS Let's Encrypt / Wildcard RS
    ssl_certificate /etc/letsencrypt/live/siati.rumahsakit.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siati.rumahsakit.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 60M;

    # Route Khusus SSE Stream Realtime
    location /api/realtime {
        proxy_pass http://127.0.0.1:8080/api/realtime;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Forward Seluruh Request ke Apache Internal (Port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
