# ==============================================================================
# KONFIGURASI NGINX INTERNAL SHIELD (Skenario 5: Apache Front-End -> Nginx Shield)
# Lokasi: /etc/nginx/sites-available/siati-internal.conf
# Port: 127.0.0.1:8080 (Lokal) -> Meneruskan ke PM2 Next.js 127.0.0.1:3000
# ==============================================================================

server {
    listen 127.0.0.1:8080;
    server_name siati.rumahsakit.co.id;

    client_max_body_size 60M;

    # Storage Media Terlindungi X-Accel-Redirect
    location /protected-media/ {
        internal;
        alias /var/siati/media/;
    }

    # Real-Time SSE Stream tanpa buffering
    location /api/realtime {
        proxy_pass http://127.0.0.1:3000/api/realtime;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Proxy Utama ke Next.js (PM2 Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
