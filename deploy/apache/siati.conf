# ==============================================================================
# KONFIGURASI APACHE 2.4 PRODUCTION UNTUK SIATI (Skenario: PM2 + Apache)
# Lokasi file di server Linux: /etc/apache2/sites-available/siati.conf
#
# Prasyarat modul Apache wajib diaktifkan:
# sudo a2enmod proxy proxy_http proxy_wstunnel ssl rewrite headers
# ==============================================================================

<VirtualHost *:80>
    ServerName siati.rumahsakit.co.id
    ServerAdmin it-support@rumahsakit.co.id

    # Pengalihan Otomatis Seluruh Lalu Lintas HTTP ke HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/siati_error.log
    CustomLog ${APACHE_LOG_DIR}/siati_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName siati.rumahsakit.co.id
    ServerAdmin it-support@rumahsakit.co.id

    # 1. Konfigurasi SSL / TLS
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/siati.rumahsakit.co.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/siati.rumahsakit.co.id/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # 2. Header Keamanan Siber
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # 3. Batasan Ukuran Upload (60 MB untuk video kendala 60 detik)
    LimitRequestBody 62914560

    # 4. Pengaturan Reverse Proxy ke Aplikasi Next.js (PM2 Port 3000)
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward Header Standar
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Penanganan Khusus Server-Sent Events (SSE) Realtime Stream (/api/realtime)
    # Wajib menonaktifkan kompresi dan buffering agar sinyal SSE tidak terputus
    <Location "/api/realtime">
        ProxyPass http://127.0.0.1:3000/api/realtime flushpackets=on
        ProxyPassReverse http://127.0.0.1:3000/api/realtime
        SetEnv no-gzip 1
        SetEnv proxy-nokeepalive 1
        Header set Cache-Control "no-cache, no-transform"
        Header set X-Accel-Buffering "no"
    </Location>

    # Forward Seluruh Rute Aplikasi Web & API ke Next.js
    ProxyPass / http://127.0.0.1:3000/ retry=1 acquire=3000 timeout=600 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/siati_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/siati_ssl_access.log combined
</VirtualHost>
