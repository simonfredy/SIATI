# ==============================================================================
# KONFIGURASI APACHE INTERNAL (Skenario 4: PM2 + Nginx Edge -> Apache Core)
# Lokasi: /etc/apache2/sites-available/siati-internal.conf
# Port: 8080 (Listening lokal saja)
# ==============================================================================

<VirtualHost 127.0.0.1:8080>
    ServerName siati.rumahsakit.co.id

    ProxyPreserveHost On
    ProxyRequests Off

    # Forwarding Header
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Penanganan SSE Stream
    <Location "/api/realtime">
        ProxyPass http://127.0.0.1:3000/api/realtime flushpackets=on
        ProxyPassReverse http://127.0.0.1:3000/api/realtime
        SetEnv no-gzip 1
    </Location>

    # Forward ke Next.js (PM2 Port 3000)
    ProxyPass / http://127.0.0.1:3000/ timeout=600 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/siati_internal_error.log
    CustomLog ${APACHE_LOG_DIR}/siati_internal_access.log combined
</VirtualHost>
