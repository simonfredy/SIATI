# ==============================================================================
# KONFIGURASI APACHE FRONT-END EDGE (Skenario 5: Apache Front-End -> Nginx Shield)
# Lokasi: /etc/apache2/sites-available/siati-frontend.conf
# Port: 80 & 443 (Publik) -> Meneruskan ke Nginx 127.0.0.1:8080
# ==============================================================================

<VirtualHost *:80>
    ServerName siati.rumahsakit.co.id
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName siati.rumahsakit.co.id

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/siati.rumahsakit.co.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/siati.rumahsakit.co.id/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Penanganan SSE Stream Real-Time
    <Location "/api/realtime">
        ProxyPass http://127.0.0.1:8080/api/realtime flushpackets=on
        ProxyPassReverse http://127.0.0.1:8080/api/realtime
        SetEnv no-gzip 1
    </Location>

    # Forwarding Seluruh Request ke Nginx Internal di Port 8080
    ProxyPass / http://127.0.0.1:8080/ timeout=600 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/siati_edge_error.log
    CustomLog ${APACHE_LOG_DIR}/siati_edge_access.log combined
</VirtualHost>
